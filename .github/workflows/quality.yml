name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  GRAPHIFY_SKIP_HOOK: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    # macOS on purpose: some tests exercise macOS paths (launchd service, Keychain argv).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Pull requests test the merge result (the default ref), since PRs merge automatically.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Documentation and Graphify map changes skip the code gate. Markdown under
          # skills/, .agents/ and .github/ is read by code or tests (runtime prompts,
          # pinned hashes, the PR template), so it counts as code. An unknown range or
          # any other changed file runs the gate.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = '0000000000000000000000000000000000000000' ] \
            || ! files=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo 'code=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              skills/*|.agents/*|.github/*) code=true ;;
              docs/*|graphify-out/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '24.14.0'
      - name: Install declared pnpm
        if: steps.changes.outputs.code == 'true'
        run: corepack enable && corepack install
      - name: Locate pnpm store
        if: steps.changes.outputs.code == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.changes.outputs.code == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install frozen dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and unit tests (isolated stores, fake command runners)
        if: steps.changes.outputs.code == 'true'
        run: pnpm run verify:ci
